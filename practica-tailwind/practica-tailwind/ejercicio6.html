<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 6 - Formulario</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, dark *));
  </style>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-slate-900 sm:p-8 dark:bg-slate-950 dark:text-slate-100">
  <main class="mx-auto max-w-5xl">

    <form id="registro" class="mx-auto max-w-md rounded-xl bg-white p-6 shadow-sm dark:bg-slate-900">
      <h1 class="text-2xl font-bold">Registro al taller</h1>
      
      <label for="nombre" class="mt-5 block font-medium">Nombre completo</label>
      <input id="nombre" name="nombre" type="text" required autocomplete="name"
        class="mt-2 w-full rounded-lg border border-slate-400 p-3 focus:border-blue-700 focus:ring-2 focus:ring-blue-700 dark:bg-slate-800 dark:border-slate-600"
        placeholder="Juan Pérez">

      <label for="correo" class="mt-4 block font-medium">Correo electrónico</label>
      <input id="correo" name="correo" type="email" required autocomplete="email"
        class="mt-2 w-full rounded-lg border border-slate-400 p-3 focus:border-blue-700 focus:ring-2 focus:ring-blue-700 dark:bg-slate-800 dark:border-slate-600"
        placeholder="nombre@ejemplo.com">

      <button class="mt-5 w-full rounded-lg bg-blue-700 px-5 py-2.5 font-semibold text-white hover:bg-blue-800" type="submit">
        Registrar
      </button>
      <p id="mensaje" role="status" class="mt-3 text-center font-medium text-green-700 dark:text-green-400"></p>
    </form>

    <script>
      const formulario = document.querySelector('#registro');
      formulario.addEventListener('submit', (evento) => {
        evento.preventDefault();
        document.querySelector('#mensaje').textContent = 'Demostración completada. No se enviaron datos.';
        formulario.reset();
      });
    </script>
  </main>
</body>
</html>
