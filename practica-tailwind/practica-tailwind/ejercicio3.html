<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3 - Flexbox</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, dark *));
  </style>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-slate-900 sm:p-8 dark:bg-slate-950 dark:text-slate-100">
  <main class="mx-auto max-w-5xl">

    <section class="flex flex-col gap-4 rounded-xl bg-white p-6 md:flex-row md:items-center md:justify-between dark:bg-slate-900">
      <div>
        <h1 class="text-xl font-bold">Mi portafolio</h1>
        <p class="text-slate-600 dark:text-slate-300">Proyectos de desarrollo web</p>
      </div>
      <a href="#proyectos" class="rounded-lg bg-blue-700 px-4 py-2 text-center font-semibold text-white hover:bg-blue-800">
        Ver proyectos
      </a>
    </section>

    <section id="proyectos" class="mt-8">
      <h2 class="text-xl font-bold">Proyectos disponibles</h2>
      <p class="mt-2 text-slate-600 dark:text-slate-300">Aquí publicarás tus prácticas.</p>
    </section>
  </main>
</body>
</html>
